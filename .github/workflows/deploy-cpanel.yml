name: Deploy · cPanel

# بناء على CI (Node+Composer) ثم رفع FTP إلى cPanel — بلا Node على السيرفر.
#
# التفعيل خطوة بخطوة: docs/تفعيل-CI-CD-cPanel.md
#
# أسرار GitHub (Settings → Secrets and variables → Actions):
#   CPANEL_FTP_HOST
#   CPANEL_FTP_USER
#   CPANEL_FTP_PASSWORD
#   CPANEL_FTP_REMOTE_DIR     مثال: /public_html/
#   CPANEL_FTP_APP_DIR        مثال: /rpm/
# اختياري:
#   CPANEL_FTP_PORT           افتراضي 21
#   CPANEL_SSH_HOST / CPANEL_SSH_USER / CPANEL_SSH_PASSWORD أو CPANEL_SSH_KEY
# متغير (Variables):
#   CPANEL_SSH_POSTDEPLOY=true   لتفعيل أوامر artisan بعد الرفع عبر SSH

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب deploy للتأكيد'
        required: true
        type: string
      run_migrations:
        description: 'تشغيل migrate عبر SSH بعد الرفع (يتطلب CPANEL_SSH_*)'
        required: false
        type: boolean
        default: true
  # النشر التلقائي بعد الدمج على main — فعّله بعد نجاح أول نشر يدوي:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  guard:
    name: Confirm
    runs-on: ubuntu-latest
    steps:
      - name: Require confirm on manual runs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'deploy'
        run: |
          echo "اكتب deploy في خانة confirm قبل التشغيل."
          exit 1

      - name: Require FTP secrets
        env:
          HOST: ${{ secrets.CPANEL_FTP_HOST }}
          USER: ${{ secrets.CPANEL_FTP_USER }}
          PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          missing=0
          [[ -n "$HOST" ]] || { echo "ناقص: CPANEL_FTP_HOST"; missing=1; }
          [[ -n "$USER" ]] || { echo "ناقص: CPANEL_FTP_USER"; missing=1; }
          [[ -n "$PASS" ]] || { echo "ناقص: CPANEL_FTP_PASSWORD"; missing=1; }
          exit "$missing"

  build:
    name: Build bundle
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui-pwa/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, fileinfo, tokenizer, xml, curl
          coverage: none
          tools: composer

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-prod-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-prod-${{ runner.os }}-

      - name: Build production package
        run: bash scripts/build-production.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-cpanel-bundle
          path: |
            dist/cpanel
            dist/cpanel-app
            dist/README-DEPLOY.txt
          retention-days: 14

  deploy-public:
    name: FTP · public_html (SPA)
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpm-cpanel-bundle
          path: bundle

      - name: Deploy public_html via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          port: ${{ secrets.CPANEL_FTP_PORT || 21 }}
          local-dir: ./bundle/cpanel/
          server-dir: ${{ secrets.CPANEL_FTP_REMOTE_DIR || '/public_html/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.env
            **/.git*
            **/node_modules/**

  deploy-app:
    name: FTP · Laravel app (~/rpm)
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpm-cpanel-bundle
          path: bundle

      - name: Deploy Laravel app via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          port: ${{ secrets.CPANEL_FTP_PORT || 21 }}
          local-dir: ./bundle/cpanel-app/
          server-dir: ${{ secrets.CPANEL_FTP_APP_DIR || '/rpm/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.env
            **/storage/logs/**
            **/storage/app/private/**
            **/storage/framework/sessions/**
            **/storage/framework/cache/data/**
            **/storage/framework/views/**
            **/.git*
            **/node_modules/**
            **/tests/**

  post-deploy:
    name: SSH · migrate + cache (اختياري)
    needs: [deploy-public, deploy-app]
    runs-on: ubuntu-latest
    environment: production
    if: |
      vars.CPANEL_SSH_POSTDEPLOY == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.run_migrations != 'false')
    steps:
      - name: Run artisan on cPanel
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          password: ${{ secrets.CPANEL_SSH_PASSWORD }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script_stop: true
          # المسار النسبي تحت الـ home — غيّره عبر Variable: CPANEL_APP_SSH_PATH
          script: |
            set -euo pipefail
            APP_DIR="$HOME/${{ vars.CPANEL_APP_SSH_PATH || 'rpm' }}"
            cd "$APP_DIR"
            bash cpanel-post-deploy.sh
