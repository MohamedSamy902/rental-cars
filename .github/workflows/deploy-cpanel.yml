name: Deploy · cPanel

# نشر تلقائي عند الدفع على main:
#   فرونت → Vercel (من ربط GitHub، منفصل عن هذا الـ workflow)
#   باك   → cPanel عبر SSH (هذا الملف) · PUBLIC_MODE=api
#
# أسرار GitHub → Settings → Secrets and variables → Actions:
#   CPANEL_SSH_HOST=rpmrentcar.com
#   CPANEL_SSH_USER=rpmrentcar
#   CPANEL_SSH_KEY=مفتاح خاص PEM كامل
#   CPANEL_SSH_PORT=8090
#   CPANEL_PHP_BIN=/opt/cpanel/ea-php84/root/usr/bin/php
# اختياري: CPANEL_APP_DIR · CPANEL_PUBLIC_DIR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب deploy للتأكيد'
        required: true
        type: string
      seed_first:
        description: 'تشغيل db:seed (أول تثبيت فقط)'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  guard:
    name: Confirm
    runs-on: ubuntu-latest
    steps:
      - name: Require confirm on manual runs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'deploy'
        run: |
          echo "اكتب deploy في خانة confirm قبل التشغيل."
          exit 1

  build:
    name: Build bundle
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui-pwa/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, fileinfo, tokenizer, xml, curl
          coverage: none
          tools: composer

      - name: Build production package
        run: bash scripts/build-production.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-cpanel-full
          path: dist/
          retention-days: 7

  deploy-ssh:
    name: Deploy API to cPanel (SSH)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Require SSH secrets
        env:
          H: ${{ secrets.CPANEL_SSH_HOST }}
          U: ${{ secrets.CPANEL_SSH_USER }}
          K: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          if [ -z "$H" ] || [ -z "$U" ] || [ -z "$K" ]; then
            echo "::error::أضف أسرار CPANEL_SSH_HOST و CPANEL_SSH_USER و CPANEL_SSH_KEY ثم أعد التشغيل."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rpm-cpanel-full
          path: dist

      - name: Prepare SSH key
        env:
          KEY: ${{ secrets.CPANEL_SSH_KEY }}
          HOST: ${{ secrets.CPANEL_SSH_HOST }}
          PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/cpanel_deploy
          chmod 600 ~/.ssh/cpanel_deploy
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy via SSH
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_KEY: /home/runner/.ssh/cpanel_deploy
          CPANEL_APP_DIR: ${{ secrets.CPANEL_APP_DIR }}
          CPANEL_PUBLIC_DIR: ${{ secrets.CPANEL_PUBLIC_DIR }}
          SKIP_BUILD: '1'
          RUN_MIGRATE: '1'
          PUBLIC_MODE: 'api'
          PHP_BIN: ${{ secrets.CPANEL_PHP_BIN }}
          SEED_FIRST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.seed_first == true && '1' || '0' }}
        run: |
          export CPANEL_SSH_PORT="${CPANEL_SSH_PORT:-22}"
          export CPANEL_APP_DIR="${CPANEL_APP_DIR:-rpm}"
          export CPANEL_PUBLIC_DIR="${CPANEL_PUBLIC_DIR:-public_html}"
          export PHP_BIN="${PHP_BIN:-/opt/cpanel/ea-php84/root/usr/bin/php}"
          bash scripts/deploy-cpanel-ssh.sh
