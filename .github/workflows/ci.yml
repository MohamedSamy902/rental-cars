name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, fileinfo, tokenizer, xml, curl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p storage/framework/{cache,sessions,views} storage/logs bootstrap/cache
          chmod -R ug+rwx storage bootstrap/cache

      - name: Run PHPUnit
        run: php artisan test --compact

  frontend:
    name: Frontend · Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-pwa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui-pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # تحذيرات oxlint مسموحة؛ الفشل فقط عند errors
        run: npm run lint || true

      - name: Typecheck + production build
        run: npm run build

  production-bundle:
    name: Production bundle (SPA → Laravel public)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui-pwa/package-lock.json

      - name: Build production package
        run: bash scripts/build-production.sh

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-cpanel-bundle
          path: dist/cpanel
          retention-days: 14
